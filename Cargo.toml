[workspace]
members = ["crates/charp2p-core"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"

[workspace.dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
getrandom = "0.4.3"
libp2p-identity = { version = "0.3.0", features = ["ed25519", "peerid", "rand"] }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
