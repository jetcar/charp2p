[package]
name = "charp2p-app"
version = "0.1.0"
description = "Private peer-to-peer group chat for Windows and Android"
authors = ["CharP2P contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "charp2p_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
charp2p-core = { path = "../../../crates/charp2p-core" }
charp2p-mls = { path = "../../../crates/charp2p-mls" }
charp2p-network = { path = "../../../crates/charp2p-network" }
charp2p-store = { path = "../../../crates/charp2p-store" }
chacha20poly1305 = "0.10.1"
getrandom = "0.4.3"
keyring-core = "1.0.0"
libp2p = { version = "0.57.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6.1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
zeroize = "1.8.2"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
windows-native-keyring-store = "1.1.0"

[dev-dependencies]
openmls = "0.9.0"
openmls_basic_credential = "0.6.0"
openmls_traits = "0.6.0"
tempfile = "3.27.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[workspace]
