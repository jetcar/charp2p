[workspace]
members = [
    "crates/charp2p-core",
    "crates/charp2p-network",
    "crates/charp2p-store",
    "crates/charp2p-sync",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"

[workspace.dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
futures = "0.3.34"
getrandom = "0.4.3"
libp2p = { version = "0.57.0", features = ["cbor", "identify", "kad", "macros", "ping", "quic", "request-response", "tokio"] }
libp2p-identity = { version = "0.3.0", features = ["ed25519", "peerid", "rand", "serde"] }
postcard = { version = "1.1.3", features = ["alloc"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5.8"
zeroize = "1.8.2"
